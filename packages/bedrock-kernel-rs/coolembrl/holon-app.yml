# Manifeste du daemon noyau — format propre du programme (holon-app.yml).
# Le format et le nom sont les notres (heritage de design D-N030) ; les
# formats de manifestes de daemons tiers sont exclus (liste negative,
# annexe B7).
name: noyau
version: 0.1.0
kind: daemon
summary: Daemon du Noyau A1 — boot T0/T1, recu de boot R10 a chaque demarrage, surfaces lecture seule.
binary: noyau
unit: noyau.service
mcp:
  server: noyau
  groups:
    daemon:
      tools:
        - daemon_status
        - boot_state
        - boot_receipt_last
    veille: # Phase 4 (D-N041) — lecture + etat uniquement, aucun outil mutant
      tools:
        - veille_status
        - veille_last_beat
        - veille_observations
  mutating_tools: []
api:
  read_only: true # hors service d'enveloppe (Phase 2)
  routes:
    - GET /health
    - GET /boot
    - GET /state
    - POST /envelope/claim
    - POST /envelope/effect
    - GET /envelope/state
    - GET /envelope/proof
    - POST /workgraph/transition
    - POST /workgraph/reconcile
    - GET /workgraph/mission
    - GET /workgraph/eligible
    - GET /workgraph/lease-holder
    - GET /workgraph/pending-reconciliations
    - GET /workgraph/assertion
anchor:
  mechanism: ABSENT # ACTIVE seulement apres l'acte d'activation post-preuves H-P2
  policy: DENY_ALL # surface brute /anchor : refus types uniquement
  capabilities_granted: 0 # a vide ; en service = capacites des baux vivants (etat lu au store)
authority_tools:
  # Outils hors daemon des profils des cinq Apps (aucun effet externe).
  - authority/compile_profiles.py
  - authority/reconcile_profiles.py
  - authority/check_profiles.py
watchdog:
  status: NOT_INSTALLED # service N2 : Phase 4
  slot: GET /state (champ watchdog)
provenance: clean-room — code original du programme, aucune reprise de code tiers de daemon.
