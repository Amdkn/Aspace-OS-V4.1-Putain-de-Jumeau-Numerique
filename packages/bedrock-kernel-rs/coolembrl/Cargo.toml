[package]
name = "noyau"
version = "0.1.0"
edition = "2021"
description = "Daemon du Noyau A1 (CoolEmbrl 1.0) — boot T0/T1, recu de boot R10, surfaces lecture seule, ancrage d'autorite deny-by-default. Code propre (clean-room) : aucune reprise de code tiers de daemon ; dependances = crates publiques listees au registre des licences du mono-repo."
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
